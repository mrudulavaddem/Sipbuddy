name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the app folder
        shell: bash
        run: |
          conf=$(git ls-files | grep 'src-tauri/tauri.conf.json$' | head -1)
          if [ -z "$conf" ]; then echo "Could not find src-tauri/tauri.conf.json - was the src-tauri folder uploaded?"; exit 1; fi
          dir=$(dirname "$(dirname "$conf")")
          echo "App folder: $dir"
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.APP_DIR }}
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: v__VERSION__
          releaseName: Sip Buddy v__VERSION__
          releaseBody: |
            **Windows:** download the `.exe` file below.
            **Mac:** download the `.dmg` file below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
